<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anti-dead internet</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="shell">
      <section id="setup" class="setup" hidden>
        <div>
          <p class="eyebrow">First-time setup</p>
          <h2>Connect TypeSafe</h2>
          <p class="description">
            Your key stays in this browser profile. When active, tweet text is sent to TypeSafe
            for classification.
          </p>
        </div>
        <form id="key-form">
          <label for="api-key">TypeSafe API key</label>
          <input
            id="api-key"
            name="apiKey"
            type="password"
            autocomplete="off"
            spellcheck="false"
            placeholder="Paste your key"
            required
          />
          <button id="save-key" class="primary" type="submit">Validate and continue</button>
        </form>
        <p id="setup-error" class="error" role="alert"></p>
      </section>

      <section id="controls" class="controls" hidden>
        <header class="header">
          <div class="product-title">
            <img src="../../assets/anti-dead.svg" alt="" width="28" height="28" />
            <h1>Anti-dead internet</h1>
          </div>
          <button id="enabled" class="power" type="button" aria-label="Pause filtering">
            <span id="enabled-label" aria-hidden="true"></span>
          </button>
        </header>

        <div class="controls-body">
          <div class="confidence-control">
            <span id="confidence-label" class="control-label">Confidence</span>
            <div class="confidence-selector" role="radiogroup" aria-labelledby="confidence-label">
              <label class="segment">
                <input type="radio" name="confidence" value="low" />
                <span>Low</span>
              </label>
              <label class="segment">
                <input type="radio" name="confidence" value="medium" />
                <span>Medium</span>
              </label>
              <label class="segment">
                <input type="radio" name="confidence" value="high" />
                <span>High</span>
              </label>
            </div>
          </div>

          <div class="settings">
            <label class="check-control" for="auto-hide">
              <span>Automatically hide AI-generated posts</span>
              <input id="auto-hide" type="checkbox" />
              <span class="checkbox" aria-hidden="true"></span>
            </label>

            <label class="check-control" for="show-scores">
              <span>Show score on all posts</span>
              <input id="show-scores" type="checkbox" />
              <span class="checkbox" aria-hidden="true"></span>
            </label>
          </div>
          <p id="controls-error" class="error controls-error" role="alert"></p>
        </div>

        <footer class="footer">
          <button id="open-settings" class="settings-action" type="button" aria-label="Open settings">
            <span aria-hidden="true"></span>
          </button>
        </footer>
      </section>
    </main>
  </body>
</html>
